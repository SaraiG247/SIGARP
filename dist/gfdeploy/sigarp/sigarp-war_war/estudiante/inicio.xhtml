<ui:composition template="/WEB-INF/plantillas/panel.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="primefaces">
    <ui:define name="title">Mi panel</ui:define>
    <ui:define name="content">
        <h1>Hola, #{sesionBean.nombre}</h1>
        <p class="sg-subtitulo">Registra tu expediente final o busca proyectos de referencia.</p>

        <div class="sg-grid-2">
            <div class="sg-tarjeta">
                <div class="sg-icono"><i class="pi pi-upload"></i></div>
                <h3>Registrar mi proyecto</h3>
                <p style="margin-bottom: 14px;">Captura los datos de tu residencia y adjunta informe, manuales y software.</p>
                <p:linkButton value="Registrar" outcome="/estudiante/registrar" icon="pi pi-upload"/>
            </div>
            <div class="sg-tarjeta">
                <div class="sg-icono"><i class="pi pi-search"></i></div>
                <h3>Buscar referencias</h3>
                <p style="margin-bottom: 14px;">Encuentra proyectos similares al tuyo o propuestas para continuar.</p>
                <p:linkButton value="Explorar acervo" outcome="/explorar" icon="pi pi-search" styleClass="ui-button-secondary"/>
            </div>
        </div>
    </ui:define>
</ui:composition>
